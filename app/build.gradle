plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.karya.business'
    compileSdk 34

    defaultConfig {
        applicationId "com.karya.business"
        minSdk 24
        targetSdk 34
        versionCode 29
        versionName "2.1.2"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "IS_BETA", "false"
            buildConfigField "String", "APP_ENV", "\"production\""
            buildConfigField "String", "APP_VERSION_NAME", "\"2.1.2\""
            resValue "string", "app_name", "वर्मा मैरिज हॉल"
        }
        debug {
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta"
            minifyEnabled false
            buildConfigField "boolean", "IS_BETA", "true"
            buildConfigField "String", "APP_ENV", "\"beta\""
            buildConfigField "String", "APP_VERSION_NAME", "\"2.5.2-beta\""
            resValue "string", "app_name", "VMH (Beta)"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-messaging'
}
