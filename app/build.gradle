plugins {
    id 'com.android.application'
}

android {
    namespace 'com.karya.business'
    compileSdk 34

    defaultConfig {
        applicationId "com.karya.business"
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName "1.1"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
