<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Admin - Send Reminder to Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 520px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    p.sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
    
    .status-badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .device-count { font-weight: 700; color: #38bdf8; font-size: 1.1rem; }
    .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; margin-right: 6px; animation: pulse 1.5s infinite; }
    
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    input, textarea { width: 100%; background: #0b0f19; border: 1px solid #334155; color: white; padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; outline: none; }
    input:focus, textarea:focus { border-color: #2563eb; }
    textarea { resize: vertical; min-height: 80px; }
    
    .quick-templates { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .tpl-chip { background: #334155; border: none; color: #cbd5e1; padding: 6px 12px; border-radius: 16px; font-size: 0.78rem; cursor: pointer; transition: 0.2s; }
    .tpl-chip:hover { background: #2563eb; color: white; }
    
    .btn-send { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-send:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-send:active { transform: translateY(0); }
    
    .log-box { margin-top: 20px; padding: 12px; background: #0b0f19; border-radius: 10px; font-family: monospace; font-size: 0.8rem; color: #10b981; min-height: 50px; }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💻 Laptop Sender Panel</h1>
    <p class="sub">Yahan se reminder bhejein aur phone me live pop-up aayega</p>

    <div class="status-badge">
      <span><span class="dot"></span>Connected Phones (Live)</span>
      <span class="device-count" id="countDisplay">0 Phone</span>
    </div>

    <div class="field">
      <label>Reminder Title (शीर्षक)</label>
      <input type="text" id="titleInput" value="🌾 खेत का जरूरी काम!">
    </div>

    <div class="field">
      <label>Reminder Message (संदेश)</label>
      <textarea id="messageInput">आज शाम 6 बजे ट्यूबवेल चालू करना है और खाद चेक करनी है।</textarea>
    </div>

    <div class="field">
      <label>Quick Templates (क्विक क्लिक):</label>
      <div class="quick-templates">
        <button class="tpl-chip" onclick="setTemplate('🌾 सिंचाई का समय', 'खेत के पश्चिमी हिस्से में 2 घंटे पानी चलाना है।')">🌾 सिंचाई</button>
        <button class="tpl-chip" onclick="setTemplate('🛒 दुकान का सामान', 'मार्केट से नया स्टॉक और रसीद लानी है।')">🛒 दुकान</button>
        <button class="tpl-chip" onclick="setTemplate('⚡ बिजली बिल', 'आज अंतिम तारीख है, बिल अवश्य भरें।')">⚡ बिल भुगतान</button>
        <button class="tpl-chip" onclick="setTemplate('💊 दवाई का समय', 'रात को खाना खाने के बाद दवाई लेना न भूलें।')">💊 स्वास्थ्य</button>
      </div>
    </div>

    <button class="btn-send" onclick="sendNotification()">
      <span>📲 मोबाइल पर नोटिफिकेशन भेजें (Send Pop-up)</span>
    </button>

    <div class="log-box" id="logBox">Status: Ready. Waiting for send action...</div>
  </div>

  <script>
    function setTemplate(title, msg) {
      document.getElementById('titleInput').value = title;
      document.getElementById('messageInput').value = msg;
    }

    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('countDisplay').textContent = `${data.connectedDevices} Phone connected`;
      } catch (e) {}
    }

    setInterval(checkStatus, 2000);
    checkStatus();

    async function sendNotification() {
      const title = document.getElementById('titleInput').value.trim();
      const message = document.getElementById('messageInput').value.trim();
      const logBox = document.getElementById('logBox');

      if (!title || !message) {
        alert('Title aur message dono likhein!');
        return;
      }

      logBox.textContent = `[${new Date().toLocaleTimeString()}] Sending notification to mobile...`;

      try {
        const res = await fetch('/api/send-notification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, message })
        });
        const result = await res.json();
        if (result.success) {
          logBox.innerHTML = `✅ [${new Date().toLocaleTimeString()}] SENT! Delivered to ${result.deliveredTo} phone(s)! Phone par pop-up check karein.`;
        } else {
          logBox.innerHTML = `❌ Error: ${result.error}`;
        }
      } catch (err) {
        logBox.innerHTML = `❌ Network Error: ${err.message}`;
      }
    }
  </script>

</body>
</html>
