<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>
  <circle cx="256" cy="256" r="170" fill="white" opacity="0.1"/>
  <!-- Checkmark & Streak Flame Icon in Center -->
  <g filter="url(#shadow)">
    <!-- Checkmark path -->
    <path d="M160 260 L230 330 L352 190" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Small flame/star badge -->
    <circle cx="360" cy="160" r="40" fill="#F59E0B"/>
    <path d="M360 140 C350 152 345 160 345 168 C345 178 352 185 360 185 C368 185 375 178 375 168 C375 160 370 152 360 140 Z" fill="#EF4444"/>
